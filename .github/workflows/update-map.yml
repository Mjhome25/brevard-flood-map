name: Update map

# Started every 15 minutes by the Cloudflare Worker in timer/ (GitHub's own schedule never fired).
on:
  workflow_dispatch:
    inputs:
      force_news:
        description: Run the news sweep now, even if it ran recently
        type: boolean
        default: false

concurrency:
  group: update-map
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No-fade safety tests
        run: |
          python3 -I tests/test_no_fade.py "$PWD"
          python3 -I tests/test_events.py "$PWD"
          python3 -I tests/test_reconcile.py "$PWD"
          python3 -I tests/test_water_notices.py
          python3 -I tests/test_audit.py "$PWD"
          python3 -I tests/test_coverage.py "$PWD"
          python3 -I tests/test_drops.py "$PWD"

      - name: Snapshot the accepted closure history
        run: cp closure_events.jsonl "$RUNNER_TEMP/events.before"

      - name: Install Claude SDK
        run: pip install --quiet anthropic

      - name: News and police sweep (Claude, about every 45 min)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 news_sweep.py ${{ inputs.force_news && '--force' || '' }}

      - name: Pull road, crash and weather feeds
        run: python3 -I update_flood_data.py

      - name: Check the Melbourne boil-water notice
        continue-on-error: true
        run: python3 -I update_water_notices.py

      - name: Update closure history and road state
        run: python3 -I reconcile.py

      - name: Validate closure history
        run: python3 -I check_events.py --before "$RUNNER_TEMP/events.before"

      # Once a day (first run after 7 AM Eastern, until Dec 3): every report taken off the map, from any source, gets a
      # verdict in audit/ (a quiet ledger, no alerts). It only reads the history; a failure here never stops the map.
      # Every run: each line of the newest official city traffic update is matched against the pins (covered / weaker /
      # missed / reopening candidates / dropped) in audit/coverage.json. Read-only; a failure never stops the map.
      - name: Official advisory coverage
        continue-on-error: true
        run: python3 -I coverage.py

      # Every run: each FHP/FL511 drop is checked against every other report at that place (Mike's one-week drop trial,
      # Nov 3 to Nov 10) in audit/drops.json. Read-only; a failure never stops the map.
      - name: FHP/FL511 drop trial
        continue-on-error: true
        run: python3 -I drops.py

      - name: Daily removal audit
        continue-on-error: true
        run: python3 -I audit.py --due

      # History is saved before anything is published. If main moved during the run (a code push), the push fails
      # and the run stops without deploying; the next run starts from the new main and re-reads every source.
      - name: Save closure history and data
        run: |
          git config user.name "brevard-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in closure_events.jsonl flood_data.json manual_closures.json advisories.json news_state.json reopen_proposals.json water_notices.json *_cache.json; do [ -f "$f" ] && git add "$f"; done
          [ -d audit ] && git add audit
          git diff --cached --quiet || git commit -m "Map data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Build page
        run: python3 -I build_page.py

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@4 deploy

      - name: Check the site answers
        run: test "$(curl -s -o /dev/null -w '%{http_code}' https://brevardemergency.com/)" = 200
