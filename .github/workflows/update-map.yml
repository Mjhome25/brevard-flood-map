name: Update map

on:
  workflow_dispatch:
    inputs:
      force_news:
        description: Run the news sweep now, even if it ran recently
        type: boolean
        default: false

concurrency:
  group: update-map
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Claude SDK
        run: pip install --quiet anthropic

      - name: News and police sweep (Claude, about every 45 min)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 news_sweep.py ${{ inputs.force_news && '--force' || '' }}

      - name: Pull road, crash and weather feeds
        run: python3 -I update_flood_data.py

      - name: Build page
        run: python3 -I build_page.py

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@4 deploy

      - name: Check the site answers
        run: test "$(curl -s -o /dev/null -w '%{http_code}' https://brevardemergency.com/)" = 200

      - name: Save updated data
        if: always()
        run: |
          git config user.name "brevard-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in flood_data.json manual_closures.json advisories.json news_state.json *_cache.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "Map data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase && git push)
